name: BSL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download BSL Language Server
        run: |
          curl -L -o bsl-language-server.jar \
            "https://github.com/1c-syntax/bsl-language-server/releases/download/v0.28.5/bsl-language-server-0.28.5-exec.jar"

      - name: Run analysis
        run: |
          java -Xmx2g -jar bsl-language-server.jar \
            --analyze \
            --srcDir ./src \
            --reporter json

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}