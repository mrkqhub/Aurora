name: BSL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download BSL Language Server
        run: |
          curl -L -o bsl-language-server.jar \
            "https://github.com/1c-syntax/bsl-language-server/releases/download/v0.28.5/bsl-language-server-0.28.5-exec.jar"

      - name: Run analysis
        run: |
          java -Xmx2g -jar bsl-language-server.jar \
            --analyze \
            --srcDir ./src \
            --reporter json

      - name: Annotate PR with BSL issues
        if: always()
        run: |
          python3 -c "
          import json, urllib.parse, sys, os

          with open('bsl-json.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          # выводим первый путь как есть для отладки
          for fileinfo in data.get('fileinfos', [])[:1]:
              print('RAW PATH:', fileinfo.get('path', ''), file=sys.stderr)

          severity_map = {
              'Error': 'error',
              'Warning': 'warning',
              'Info': 'notice'
          }

          count = 0
          for fileinfo in data.get('fileinfos', []):
              path = urllib.parse.unquote(fileinfo.get('path', ''))
              path = path.replace('file:///', '')
              print('DECODED PATH:', path, file=sys.stderr)
              break
          "