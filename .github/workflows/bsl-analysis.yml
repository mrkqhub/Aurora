name: BSL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download BSL Language Server
        run: |
          curl -L -o bsl-language-server.jar \
            "https://github.com/1c-syntax/bsl-language-server/releases/download/v0.28.5/bsl-language-server-0.28.5-exec.jar"

      - name: Run analysis
        run: |
          java -Xmx2g -jar bsl-language-server.jar \
            --analyze \
            --srcDir ./src \
            --reporter json

      - name: Annotate PR with BSL issues
        if: always()
        run: |
          python3 -c "
          import json, urllib.parse, sys

          with open('bsl-json.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          severity_map = {
              'Error': 'error',
              'Warning': 'warning',
              'Info': 'notice'
          }

          count = 0
          for fileinfo in data.get('fileinfos', []):
              path = urllib.parse.unquote(fileinfo.get('path', ''))
              path = path.replace('file:///', '')
              # оставляем только часть начиная с src/
              src_pos = path.find('src/')
              if src_pos == -1:
                  continue
              path = path[src_pos:]

              for diag in fileinfo.get('diagnostics', []):
                  level = severity_map.get(diag.get('severity', 'Info'), 'notice')
                  line = diag.get('range', {}).get('start', {}).get('line', 0) + 1
                  col = diag.get('range', {}).get('start', {}).get('character', 0) + 1
                  message = diag.get('message', '').replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  code = diag.get('code', '')
                  print(f'::{level} file={path},line={line},col={col}::{code}: {message}')
                  count += 1

          print(f'::notice::Всего замечаний: {count}')
          "