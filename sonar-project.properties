# ключ проекта
sonar.projectKey=mrkqhub_Aurora
sonar.organization=mrkqhub

# имя проекта
sonar.projectName=1C: Aurora

# версия проекта 
sonar.projectVersion=1.0

# относительный или абсолютный путь к каталогу с исходными кодом
sonar.sources=src

# кодировка
sonar.sourceEncoding=UTF-8

# маска поиска файлов на проверку
sonar.inclusions=**/*.bsl

# игнорирование gitignore
sonar.scm.exclusions.disabled=true

# для Git
sonar.scm.enabled=true
sonar.scm.provider=git

# путь к результату анализа
sonar.bsl.languageserver.reportPaths=bsl-json.json